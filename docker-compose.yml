services:
  postgres:
    image: postgres:16-alpine
    container_name: grc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: game_calendar
    ports:
      - '5432:5432'
    volumes:
      - grc_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d game_calendar']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  grc_pg_data:
