<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1220" />
    <title>Sin conexión — Game Release Calendar</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", "Noto Sans", system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #0b1220;
        color: #e8eef9;
        padding: 1.5rem;
      }
      main {
        max-width: 28rem;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        color: #5eead4;
      }
      p {
        color: #94a3b8;
        line-height: 1.5;
      }
      button {
        margin-top: 1rem;
        min-height: 2.75rem;
        padding: 0.5rem 1rem;
        border-radius: 0.75rem;
        border: 1px solid rgba(94, 234, 212, 0.4);
        background: transparent;
        color: #5eead4;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión</h1>
      <p>
        No hay red en este momento. Puedes seguir viendo pantallas ya visitadas si estaban en
        caché, pero no se guardarán cambios hasta recuperar la conexión.
      </p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
